<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Base Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f1;
      --surface: #ffffff;
      --surface-soft: #f9faf6;
      --text: #172026;
      --muted: #68737d;
      --line: #d9dfd5;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --coral: #c2410c;
      --amber: #b7791f;
      --danger: #b42318;
      --code: #eef2ec;
      --shadow: 0 18px 40px rgba(24, 36, 30, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .sidebar,
    .refs-panel {
      background: var(--surface-soft);
      border-color: var(--line);
      padding: 20px;
    }

    .sidebar {
      border-right: 1px solid var(--line);
    }

    .refs-panel {
      border-left: 1px solid var(--line);
      overflow-y: auto;
    }

    .brand {
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.15;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 10px 12px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--amber);
    }

    .status.ok .status-dot {
      background: var(--accent);
    }

    .status.bad .status-dot {
      background: var(--danger);
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    label,
    .meta-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .meta-stack {
      display: grid;
      gap: 8px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .meta-item {
      overflow-wrap: anywhere;
    }

    .clear-button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 10px 12px;
      font-weight: 700;
    }

    .clear-button:hover {
      border-color: #c7d0c5;
      background: #fbfcfa;
    }

    .secondary-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 11px;
      font-size: 13px;
      font-weight: 800;
    }

    .secondary-button:hover {
      border-color: #c7d0c5;
      background: #fbfcfa;
    }

    .auth-panel,
    .sessions-panel,
    .admin-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 12px;
      margin-bottom: 16px;
    }

    .auth-panel .field {
      margin-bottom: 10px;
    }

    .login-actions,
    .user-panel,
    .session-toolbar,
    .admin-toolbar,
    .admin-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .login-button {
      width: 100%;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .login-button:hover {
      background: var(--accent-strong);
    }

    .login-error {
      min-height: 18px;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.4;
    }

    .user-name {
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-list {
      display: grid;
      gap: 7px;
      margin-top: 10px;
      max-height: 220px;
      overflow-y: auto;
    }

    .session-button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text);
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-button.active {
      border-color: #8bc6bd;
      background: #eaf8f5;
      color: #0f4f4a;
      font-weight: 800;
    }

    .admin-create {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .checkbox-line input {
      width: auto;
    }

    .admin-error {
      min-height: 18px;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.4;
    }

    .admin-list {
      display: grid;
      gap: 9px;
      margin-top: 12px;
      max-height: 280px;
      overflow-y: auto;
    }

    .admin-user {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      padding: 10px;
    }

    .admin-user-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .admin-user-name {
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .admin-user-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .admin-actions {
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .danger-button {
      border-color: #f3b4ad;
      color: var(--danger);
    }

    .chat-column {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 100vh;
      background: #fbfcf8;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
    }

    .chat-title {
      min-width: 0;
    }

    .chat-title h2 {
      margin: 0;
      font-size: 18px;
    }

    .chat-title span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compact-chip {
      border: 1px solid #d5c6aa;
      border-radius: 999px;
      background: #fff8ed;
      color: #7c4a03;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chat-log {
      overflow-y: auto;
      padding: 24px;
    }

    .empty-state {
      max-width: 680px;
      margin: 10vh auto 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .empty-state h2 {
      margin: 0;
      font-size: 24px;
    }

    .empty-state p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .message {
      display: grid;
      gap: 8px;
      max-width: 860px;
      margin: 0 auto 18px;
    }

    .message.user {
      justify-items: end;
    }

    .message.assistant {
      justify-items: start;
    }

    .role {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .message-route {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      width: min(760px, 100%);
      overflow-wrap: anywhere;
    }

    .route-pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      padding: 3px 8px;
      font-weight: 800;
    }

    .bubble {
      max-width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 15px;
      white-space: pre-wrap;
      line-height: 1.62;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      border-color: #a8d5cb;
      background: #eaf8f5;
    }

    .assistant .bubble {
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(24, 36, 30, 0.05);
    }

    .bubble.loading {
      color: var(--muted);
    }

    .bubble.error {
      border-color: #f3b4ad;
      background: #fff2f0;
      color: var(--danger);
    }

    .bubble.markdown {
      white-space: normal;
    }

    .bubble.markdown p,
    .bubble.markdown ul,
    .bubble.markdown ol,
    .bubble.markdown pre {
      margin: 0 0 0.85em;
    }

    .bubble.markdown > :last-child {
      margin-bottom: 0;
    }

    .bubble.markdown ul,
    .bubble.markdown ol {
      padding-left: 1.25em;
    }

    .bubble.markdown code {
      border-radius: 5px;
      background: var(--code);
      padding: 0.12em 0.32em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    .bubble.markdown pre {
      overflow-x: auto;
      border-radius: 8px;
      background: var(--code);
      padding: 11px 12px;
      white-space: pre;
    }

    .bubble.markdown pre code {
      padding: 0;
      background: transparent;
    }

    .message-refs {
      width: min(760px, 100%);
    }

    details {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      padding: 10px 12px;
    }

    summary {
      cursor: pointer;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 800;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      padding: 16px 24px 20px;
    }

    .composer-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      max-width: 920px;
      margin: 0 auto;
      align-items: end;
    }

    textarea {
      width: 100%;
      min-height: 58px;
      max-height: 190px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 13px 14px;
      line-height: 1.5;
      outline: none;
    }

    .send-button {
      min-width: 104px;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 13px 18px;
      font-weight: 800;
    }

    .send-button:hover {
      background: var(--accent-strong);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .refs-panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .refs-empty {
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .ref-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 12px;
      margin-bottom: 12px;
    }

    .ref-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .ref-source {
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .ref-score {
      color: var(--coral);
      font-weight: 800;
      white-space: nowrap;
    }

    code {
      display: block;
      border-radius: 6px;
      background: var(--code);
      color: #34413b;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1100px) {
      .app-shell {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .refs-panel {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .chat-column {
        min-height: 70vh;
      }

      .chat-header {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px;
      }

      .chat-log {
        padding: 16px;
      }

      .composer {
        padding: 14px 16px 16px;
      }

      .composer-inner {
        grid-template-columns: 1fr;
      }

      .send-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>Knowledge Base Assistant</h1>
        <p id="modelName">Loading model metadata</p>
      </div>

      <div id="status" class="status">
        <span id="statusText">Checking</span>
        <span class="status-dot"></span>
      </div>

      <div id="authPanel" class="auth-panel" hidden>
        <form id="loginForm">
          <div class="field">
            <label for="loginUsername">Username</label>
            <input id="loginUsername" autocomplete="username">
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password">
          </div>
          <button id="loginButton" class="login-button" type="submit">Sign In</button>
          <div id="loginError" class="login-error"></div>
        </form>
        <div id="userPanel" class="user-panel" hidden>
          <div id="userName" class="user-name"></div>
          <button id="logoutButton" class="secondary-button" type="button">Sign Out</button>
        </div>
      </div>

      <div id="sessionsPanel" class="sessions-panel" hidden>
        <div class="session-toolbar">
          <div class="meta-label">Sessions</div>
          <button id="newSessionButton" class="secondary-button" type="button">New</button>
        </div>
        <div id="sessionList" class="session-list"></div>
      </div>

      <div id="adminPanel" class="admin-panel" hidden>
        <div class="admin-toolbar">
          <div class="meta-label">Admin</div>
          <button id="adminRefreshButton" class="secondary-button" type="button">Refresh</button>
        </div>
        <form id="adminCreateForm" class="admin-create">
          <input id="adminNewUsername" placeholder="Username" autocomplete="off">
          <input id="adminNewPassword" type="password" placeholder="Password" autocomplete="new-password">
          <label class="checkbox-line">
            <input id="adminNewIsAdmin" type="checkbox">
            Admin
          </label>
          <button class="login-button" type="submit">Add User</button>
          <div id="adminError" class="admin-error"></div>
        </form>
        <div id="adminUserList" class="admin-list"></div>
      </div>

      <div class="field">
        <label for="topK">Top K</label>
        <input id="topK" type="number" min="1">
      </div>

      <button id="clearButton" class="clear-button" type="button">Clear Chat</button>

      <div class="meta-stack">
        <div>
          <div class="meta-label">Collection</div>
          <div id="collectionName" class="meta-item">Unknown</div>
        </div>
        <div>
          <div class="meta-label">Max Output</div>
          <div id="maxTokens" class="meta-item">Unknown</div>
        </div>
        <div>
          <div class="meta-label">Last Route</div>
          <div id="latestRoute" class="meta-item">None</div>
        </div>
      </div>
    </aside>

    <section class="chat-column">
      <header class="chat-header">
        <div class="chat-title">
          <h2>Conversation</h2>
          <span id="subtitle">Answers grounded in a local Markdown knowledge base</span>
        </div>
        <div id="compactChip" class="compact-chip" hidden>Memory compacted</div>
      </header>

      <div id="chatLog" class="chat-log"></div>

      <form id="composer" class="composer">
        <div class="composer-inner">
          <textarea id="prompt" rows="2" placeholder="Ask a question about the indexed knowledge base"></textarea>
          <button id="sendButton" class="send-button" type="submit">Send</button>
        </div>
      </form>
    </section>

    <aside class="refs-panel">
      <h2>References</h2>
      <div id="referenceList" class="refs-empty">No references yet.</div>
    </aside>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const statusTextEl = document.getElementById("statusText");
    const modelNameEl = document.getElementById("modelName");
    const collectionNameEl = document.getElementById("collectionName");
    const maxTokensEl = document.getElementById("maxTokens");
    const latestRouteEl = document.getElementById("latestRoute");
    const compactChipEl = document.getElementById("compactChip");
    const chatLogEl = document.getElementById("chatLog");
    const referenceListEl = document.getElementById("referenceList");
    const composerEl = document.getElementById("composer");
    const promptEl = document.getElementById("prompt");
    const topKEl = document.getElementById("topK");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const authPanelEl = document.getElementById("authPanel");
    const loginFormEl = document.getElementById("loginForm");
    const loginUsernameEl = document.getElementById("loginUsername");
    const loginPasswordEl = document.getElementById("loginPassword");
    const loginButtonEl = document.getElementById("loginButton");
    const loginErrorEl = document.getElementById("loginError");
    const userPanelEl = document.getElementById("userPanel");
    const userNameEl = document.getElementById("userName");
    const logoutButtonEl = document.getElementById("logoutButton");
    const sessionsPanelEl = document.getElementById("sessionsPanel");
    const sessionListEl = document.getElementById("sessionList");
    const newSessionButtonEl = document.getElementById("newSessionButton");
    const adminPanelEl = document.getElementById("adminPanel");
    const adminRefreshButtonEl = document.getElementById("adminRefreshButton");
    const adminCreateFormEl = document.getElementById("adminCreateForm");
    const adminNewUsernameEl = document.getElementById("adminNewUsername");
    const adminNewPasswordEl = document.getElementById("adminNewPassword");
    const adminNewIsAdminEl = document.getElementById("adminNewIsAdmin");
    const adminErrorEl = document.getElementById("adminError");
    const adminUserListEl = document.getElementById("adminUserList");

    const state = {
      messages: [],
      conversationSummary: "",
      summarizedMessageCount: 0,
      busy: false,
      authEnabled: false,
      authToken: "",
      currentUser: null,
      sessions: [],
      activeSessionId: "",
      adminUsers: []
    };
    const apiTokenStorageKey = "knowledgeBaseAssistantApiToken";
    const authTokenStorageKey = "knowledgeBaseAssistantAuthToken";

    function setStatus(text, className) {
      statusTextEl.textContent = text;
      statusEl.className = `status ${className || ""}`.trim();
    }

    function authHeaders(headers = {}) {
      const token = state.authEnabled
        ? state.authToken || localStorage.getItem(authTokenStorageKey)
        : localStorage.getItem(apiTokenStorageKey);
      if (!token) return headers;
      return {...headers, Authorization: `Bearer ${token}`};
    }

    async function fetchWithAuth(url, options = {}) {
      const request = () => fetch(url, {
        ...options,
        headers: authHeaders(options.headers || {})
      });

      let response = await request();
      if (response.status !== 401) return response;
      if (state.authEnabled) {
        signOutLocal("Session expired. Sign in again.");
        return response;
      }

      const token = window.prompt("API token required");
      if (!token) return response;

      localStorage.setItem(apiTokenStorageKey, token.trim());
      response = await request();
      if (response.status === 401) {
        localStorage.removeItem(apiTokenStorageKey);
      }
      return response;
    }

    async function checkHealth() {
      try {
        const liveResponse = await fetch("/health");
        if (!liveResponse.ok) {
          setStatus("Offline", "bad");
          return;
        }

        if (state.authEnabled && !state.currentUser) {
          setStatus("Login required", "bad");
          return;
        }

        const response = await fetchWithAuth("/health/details");
        if (response.status === 401) {
          setStatus("Auth required", "bad");
          return;
        }
        const data = await response.json();
        const ready = Boolean(data.qdrant && data.llm);
        setStatus(ready ? "Ready" : "Degraded", ready ? "ok" : "bad");
        modelNameEl.textContent = data.llm_model || "Unknown model";
        collectionNameEl.textContent = data.collection || "Unknown";
        maxTokensEl.textContent = data.llm_max_tokens
          ? `${data.llm_max_tokens} tokens`
          : "Unknown";
        if (data.api_top_k_max) {
          topKEl.max = String(data.api_top_k_max);
        }
        if (data.retrieve_top_k) {
          topKEl.placeholder = String(data.retrieve_top_k);
        }
      } catch {
        setStatus("Offline", "bad");
      }
    }

    function updateAuthPanels() {
      authPanelEl.hidden = !state.authEnabled;
      sessionsPanelEl.hidden = !state.authEnabled || !state.currentUser;
      adminPanelEl.hidden =
        !state.authEnabled || !state.currentUser || !state.currentUser.is_admin;
      loginFormEl.hidden = !state.authEnabled || Boolean(state.currentUser);
      userPanelEl.hidden = !state.authEnabled || !state.currentUser;
      composerEl.hidden = state.authEnabled && !state.currentUser;
      clearButton.disabled = state.authEnabled && !state.currentUser;

      if (state.currentUser) {
        userNameEl.textContent = state.currentUser.username;
      } else {
        userNameEl.textContent = "";
      }
    }

    function signOutLocal(message = "") {
      state.authToken = "";
      state.currentUser = null;
      state.sessions = [];
      state.adminUsers = [];
      state.activeSessionId = "";
      state.messages = [];
      state.conversationSummary = "";
      state.summarizedMessageCount = 0;
      localStorage.removeItem(authTokenStorageKey);
      loginErrorEl.textContent = message;
      latestRouteEl.textContent = "None";
      compactChipEl.hidden = true;
      renderSessions();
      renderAdminUsers();
      renderMessages();
      renderReferences([]);
      updateAuthPanels();
      if (state.authEnabled) setStatus("Login required", "bad");
    }

    async function loadAuthConfig() {
      try {
        const response = await fetch("/auth/config");
        const data = response.ok ? await response.json() : {};
        state.authEnabled = Boolean(data.auth_enabled);
      } catch {
        state.authEnabled = false;
      }

      updateAuthPanels();
      if (state.authEnabled) {
        await restoreAuthSession();
      } else {
        await checkHealth();
      }
    }

    async function restoreAuthSession() {
      state.authToken = localStorage.getItem(authTokenStorageKey) || "";
      if (!state.authToken) {
        signOutLocal("");
        return;
      }

      const response = await fetchWithAuth("/auth/me");
      if (!response.ok) {
        signOutLocal("Session expired. Sign in again.");
        return;
      }

      state.currentUser = await response.json();
      updateAuthPanels();
      await loadSessions(true);
      if (state.currentUser.is_admin) {
        await loadAdminUsers();
      }
      await checkHealth();
    }

    async function login(username, password) {
      loginButtonEl.disabled = true;
      loginErrorEl.textContent = "";
      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({username, password})
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Sign in failed");
        }

        state.authToken = data.token;
        state.currentUser = data.user;
        localStorage.setItem(authTokenStorageKey, data.token);
        loginPasswordEl.value = "";
        updateAuthPanels();
        await loadSessions(true);
        if (state.currentUser.is_admin) {
          await loadAdminUsers();
        }
        await checkHealth();
      } catch (error) {
        loginErrorEl.textContent = error.message;
      } finally {
        loginButtonEl.disabled = false;
      }
    }

    async function logout() {
      if (state.authToken) {
        await fetchWithAuth("/auth/logout", {method: "POST"});
      }
      signOutLocal("");
    }

    async function loadSessions(selectFirst = false) {
      if (!state.authEnabled || !state.currentUser) return;

      const response = await fetchWithAuth("/sessions");
      if (!response.ok) {
        signOutLocal("Unable to load sessions.");
        return;
      }

      state.sessions = await response.json();
      renderSessions();

      if (!state.sessions.length) {
        await createNewSession();
        return;
      }

      const activeStillExists = state.sessions.some(
        (session) => session.id === state.activeSessionId
      );
      if (selectFirst || !activeStillExists) {
        await loadSession(state.sessions[0].id);
      }
    }

    async function createNewSession() {
      const response = await fetchWithAuth("/sessions", {method: "POST"});
      if (!response.ok) {
        signOutLocal("Unable to create a session.");
        return;
      }
      const session = await response.json();
      applySessionDetail(session);
      await loadSessions(false);
      promptEl.focus();
    }

    async function loadSession(sessionId) {
      if (!sessionId || sessionId === state.activeSessionId) {
        renderSessions();
        return;
      }

      const response = await fetchWithAuth(`/sessions/${sessionId}`);
      if (!response.ok) {
        await loadSessions(true);
        return;
      }

      const session = await response.json();
      applySessionDetail(session);
      promptEl.focus();
    }

    function applySessionDetail(session) {
      state.activeSessionId = session.id;
      state.conversationSummary = session.conversation_summary || "";
      state.summarizedMessageCount = session.compacted_message_count || 0;
      state.messages = (session.messages || []).map((message) => ({
        role: message.role,
        content: message.content,
        contexts: message.contexts || [],
        usedRag: Boolean(message.used_rag),
        route: message.route || "",
        routeReason: message.route_reason || ""
      }));
      compactChipEl.hidden = !state.conversationSummary;
      latestRouteEl.textContent = "None";
      const lastAssistant = [...state.messages]
        .reverse()
        .find((message) => message.role === "assistant");
      if (lastAssistant) {
        latestRouteEl.textContent =
          `${lastAssistant.usedRag ? "RAG" : "Direct"} · ${lastAssistant.route || "unknown"}`;
        renderReferences(lastAssistant.contexts || [], lastAssistant.usedRag);
      } else {
        renderReferences([]);
      }
      renderSessions();
      renderMessages();
    }

    function renderSessions() {
      sessionListEl.innerHTML = "";
      if (!state.sessions.length) {
        const empty = document.createElement("div");
        empty.className = "refs-empty";
        empty.textContent = "No saved sessions.";
        sessionListEl.appendChild(empty);
        return;
      }

      for (const session of state.sessions) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "session-button";
        if (session.id === state.activeSessionId) {
          button.classList.add("active");
        }
        button.textContent = session.title || "New chat";
        button.addEventListener("click", () => loadSession(session.id));
        sessionListEl.appendChild(button);
      }
    }

    async function loadAdminUsers() {
      if (!state.currentUser?.is_admin) return;

      const response = await fetchWithAuth("/admin/users");
      if (!response.ok) {
        adminErrorEl.textContent = "Unable to load users.";
        return;
      }

      state.adminUsers = await response.json();
      adminErrorEl.textContent = "";
      renderAdminUsers();
    }

    async function createAdminUser(username, password, isAdmin) {
      const response = await fetchWithAuth("/admin/users", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password, is_admin: isAdmin})
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.detail || "Unable to add user.");
      }
      adminNewUsernameEl.value = "";
      adminNewPasswordEl.value = "";
      adminNewIsAdminEl.checked = false;
      await loadAdminUsers();
    }

    async function setAdminRole(userId, isAdmin) {
      const response = await fetchWithAuth(`/admin/users/${userId}/role`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({is_admin: isAdmin})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.detail || "Unable to update role.");
      }
      await loadAdminUsers();
    }

    async function resetAdminUserPassword(userId) {
      const password = window.prompt("New password");
      if (!password) return;

      const response = await fetchWithAuth(`/admin/users/${userId}/password`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.detail || "Unable to reset password.");
      }
      adminErrorEl.textContent = "";
    }

    async function clearAdminUserData(userId, username) {
      if (!window.confirm(`Clear chat data for ${username}?`)) return;

      const response = await fetchWithAuth(`/admin/users/${userId}/sessions`, {
        method: "DELETE"
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.detail || "Unable to clear user data.");
      }
      if (userId === state.currentUser?.id) {
        await loadSessions(true);
      }
      await loadAdminUsers();
    }

    async function deleteAdminUser(userId, username) {
      if (!window.confirm(`Delete ${username}?`)) return;

      const response = await fetchWithAuth(`/admin/users/${userId}`, {
        method: "DELETE"
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.detail || "Unable to delete user.");
      }
      await loadAdminUsers();
    }

    function renderAdminUsers() {
      adminUserListEl.innerHTML = "";
      if (!state.adminUsers.length) {
        const empty = document.createElement("div");
        empty.className = "refs-empty";
        empty.textContent = "No users.";
        adminUserListEl.appendChild(empty);
        return;
      }

      for (const user of state.adminUsers) {
        const wrapper = document.createElement("div");
        wrapper.className = "admin-user";

        const main = document.createElement("div");
        main.className = "admin-user-main";

        const identity = document.createElement("div");
        const name = document.createElement("div");
        name.className = "admin-user-name";
        name.textContent = user.username;
        const meta = document.createElement("div");
        meta.className = "admin-user-meta";
        meta.textContent =
          `${user.session_count || 0} sessions · ${user.message_count || 0} messages`;
        identity.appendChild(name);
        identity.appendChild(meta);

        const adminLabel = document.createElement("label");
        adminLabel.className = "checkbox-line";
        const adminCheckbox = document.createElement("input");
        adminCheckbox.type = "checkbox";
        adminCheckbox.checked = Boolean(user.is_admin);
        adminCheckbox.disabled = user.id === state.currentUser?.id;
        adminCheckbox.addEventListener("change", async () => {
          try {
            await setAdminRole(user.id, adminCheckbox.checked);
          } catch (error) {
            adminErrorEl.textContent = error.message;
            adminCheckbox.checked = Boolean(user.is_admin);
          }
        });
        adminLabel.appendChild(adminCheckbox);
        adminLabel.appendChild(document.createTextNode("Admin"));

        main.appendChild(identity);
        main.appendChild(adminLabel);

        const actions = document.createElement("div");
        actions.className = "admin-actions";

        const resetButton = document.createElement("button");
        resetButton.type = "button";
        resetButton.className = "secondary-button";
        resetButton.textContent = "Reset";
        resetButton.addEventListener("click", async () => {
          try {
            await resetAdminUserPassword(user.id);
          } catch (error) {
            adminErrorEl.textContent = error.message;
          }
        });

        const clearButton = document.createElement("button");
        clearButton.type = "button";
        clearButton.className = "secondary-button";
        clearButton.textContent = "Clear";
        clearButton.addEventListener("click", async () => {
          try {
            await clearAdminUserData(user.id, user.username);
          } catch (error) {
            adminErrorEl.textContent = error.message;
          }
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "secondary-button danger-button";
        deleteButton.textContent = "Delete";
        deleteButton.disabled = user.id === state.currentUser?.id;
        deleteButton.addEventListener("click", async () => {
          try {
            await deleteAdminUser(user.id, user.username);
          } catch (error) {
            adminErrorEl.textContent = error.message;
          }
        });

        actions.appendChild(resetButton);
        actions.appendChild(clearButton);
        actions.appendChild(deleteButton);

        wrapper.appendChild(main);
        wrapper.appendChild(actions);
        adminUserListEl.appendChild(wrapper);
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderInlineMarkdown(value) {
      return String(value || "")
        .split(/(`[^`]+`)/g)
        .map((part) => {
          if (part.startsWith("`") && part.endsWith("`")) {
            return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
          }
          return escapeHtml(part)
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/__([^_]+)__/g, "<strong>$1</strong>");
        })
        .join("");
    }

    function renderMarkdown(value) {
      const lines = String(value || "").replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let inCode = false;
      let codeLines = [];
      let listType = "";

      const closeList = () => {
        if (!listType) return;
        html.push(`</${listType}>`);
        listType = "";
      };

      const openList = (type) => {
        if (listType === type) return;
        closeList();
        listType = type;
        html.push(`<${type}>`);
      };

      const closeCode = () => {
        html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        codeLines = [];
        inCode = false;
      };

      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith("```")) {
          closeList();
          if (inCode) {
            closeCode();
          } else {
            inCode = true;
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        if (!trimmed) {
          closeList();
          continue;
        }

        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        if (bullet) {
          openList("ul");
          html.push(`<li>${renderInlineMarkdown(bullet[1])}</li>`);
          continue;
        }

        const numbered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (numbered) {
          openList("ol");
          html.push(`<li>${renderInlineMarkdown(numbered[1])}</li>`);
          continue;
        }

        closeList();
        html.push(`<p>${renderInlineMarkdown(line)}</p>`);
      }

      closeList();
      if (inCode) closeCode();
      return html.join("");
    }

    function renderMessages() {
      chatLogEl.innerHTML = "";

      if (state.messages.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        const title = document.createElement("h2");
        title.textContent = "Ask against your local knowledge base";
        const text = document.createElement("p");
        text.textContent =
          "The chat keeps recent turns, compacts older context, and retrieves Markdown references for each answer.";
        empty.appendChild(title);
        empty.appendChild(text);
        chatLogEl.appendChild(empty);
        return;
      }

      for (const message of state.messages) {
        const wrapper = document.createElement("article");
        wrapper.className = `message ${message.role}`;

        const role = document.createElement("div");
        role.className = "role";
        role.textContent = message.role === "user" ? "You" : "Assistant";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (message.loading) bubble.classList.add("loading");
        if (message.error) bubble.classList.add("error");
        if (message.loading || message.error) {
          bubble.textContent = message.content;
        } else {
          bubble.classList.add("markdown");
          bubble.innerHTML = renderMarkdown(message.content);
        }

        wrapper.appendChild(role);
        wrapper.appendChild(bubble);

        if (message.role === "assistant" && !message.loading && !message.error) {
          wrapper.appendChild(renderRouteMeta(message));
        }

        if (message.role === "assistant" && message.contexts?.length) {
          wrapper.appendChild(renderInlineReferences(message.contexts));
        }

        chatLogEl.appendChild(wrapper);
      }

      chatLogEl.scrollTop = chatLogEl.scrollHeight;
    }

    function renderRouteMeta(message) {
      const meta = document.createElement("div");
      meta.className = "message-route";
      const pill = document.createElement("span");
      pill.className = "route-pill";
      const mode = message.usedRag ? "RAG" : "Direct";
      pill.textContent = `${mode} · ${message.route || "unknown"}`;
      meta.appendChild(pill);

      if (message.routeReason) {
        meta.appendChild(document.createTextNode(` ${message.routeReason}`));
      }

      return meta;
    }

    function renderInlineReferences(contexts) {
      const container = document.createElement("div");
      container.className = "message-refs";
      const details = document.createElement("details");
      details.open = true;
      const summary = document.createElement("summary");
      summary.textContent = `References (${contexts.length})`;
      details.appendChild(summary);

      for (const item of contexts) {
        details.appendChild(renderReferenceCard(item, 420));
      }

      container.appendChild(details);
      return container;
    }

    function renderReferences(contexts, usedRag = true) {
      referenceListEl.innerHTML = "";
      referenceListEl.className = contexts.length && usedRag ? "" : "refs-empty";

      if (!usedRag) {
        referenceListEl.textContent = "No retrieval used for this answer.";
        return;
      }

      if (!contexts.length) {
        referenceListEl.textContent = "No references yet.";
        return;
      }

      for (const item of contexts) {
        referenceListEl.appendChild(renderReferenceCard(item, 760));
      }
    }

    function renderReferenceCard(item, maxLength) {
      const wrapper = document.createElement("div");
      wrapper.className = "ref-card";

      const meta = document.createElement("div");
      meta.className = "ref-meta";

      const source = document.createElement("div");
      source.className = "ref-source";
      const headings = Array.isArray(item.headings) && item.headings.length
        ? ` · ${item.headings.join(" > ")}`
        : "";
      source.textContent =
        `${item.source} · chunk ${item.chunk_id} · ${item.content_type || "text"}${headings}`;

      const score = document.createElement("div");
      score.className = "ref-score";
      score.textContent = Number(item.score).toFixed(4);

      const text = document.createElement("code");
      const body = item.text || "";
      text.textContent =
        body.length > maxLength ? `${body.slice(0, maxLength)}...` : body;

      meta.appendChild(source);
      meta.appendChild(score);
      wrapper.appendChild(meta);
      wrapper.appendChild(text);
      return wrapper;
    }

    function setBusy(isBusy) {
      state.busy = isBusy;
      sendButton.disabled = isBusy;
      sendButton.textContent = isBusy ? "Thinking" : "Send";
    }

    async function ask(question) {
      if (state.authEnabled && !state.activeSessionId) {
        await createNewSession();
        if (!state.activeSessionId) return;
      }

      const historyForRequest = state.authEnabled
        ? []
        : state.messages
          .slice(state.summarizedMessageCount)
          .filter((message) => !message.loading && !message.error)
          .map((message) => ({
            role: message.role,
            content: message.content
          }));

      const userMessage = {role: "user", content: question};
      const assistantMessage = {
        role: "assistant",
        content: "Thinking...",
        contexts: [],
        usedRag: false,
        route: "",
        routeReason: "",
        loading: true
      };

      state.messages.push(userMessage, assistantMessage);
      renderMessages();
      renderReferences([]);
      setBusy(true);

      try {
        const response = await fetchWithAuth("/rag", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            question,
            session_id: state.authEnabled ? state.activeSessionId : null,
            top_k: topKEl.value ? Number(topKEl.value) : null,
            history: historyForRequest,
            conversation_summary: state.conversationSummary
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Request failed");
        }

        assistantMessage.content = data.answer;
        if (data.session_id) {
          state.activeSessionId = data.session_id;
        }
        assistantMessage.contexts = data.contexts || [];
        assistantMessage.usedRag = Boolean(data.used_rag);
        assistantMessage.route = data.route || "";
        assistantMessage.routeReason = data.route_reason || "";
        assistantMessage.loading = false;
        state.conversationSummary =
          data.conversation_summary || state.conversationSummary;
        state.summarizedMessageCount += data.compacted_history_messages || 0;
        compactChipEl.hidden = !state.conversationSummary;
        latestRouteEl.textContent =
          `${assistantMessage.usedRag ? "RAG" : "Direct"} · ${assistantMessage.route || "unknown"}`;
        renderReferences(assistantMessage.contexts, assistantMessage.usedRag);
        if (state.authEnabled) {
          await loadSessions(false);
        }
      } catch (error) {
        assistantMessage.content = error.message;
        assistantMessage.loading = false;
        assistantMessage.error = true;
      } finally {
        setBusy(false);
        renderMessages();
      }
    }

    composerEl.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = promptEl.value.trim();
      if (!question || state.busy) return;
      promptEl.value = "";
      ask(question);
    });

    promptEl.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        composerEl.requestSubmit();
      }
    });

    loginFormEl.addEventListener("submit", (event) => {
      event.preventDefault();
      const username = loginUsernameEl.value.trim();
      const password = loginPasswordEl.value;
      if (!username || !password) {
        loginErrorEl.textContent = "Username and password are required.";
        return;
      }
      login(username, password);
    });

    logoutButtonEl.addEventListener("click", () => {
      logout();
    });

    newSessionButtonEl.addEventListener("click", () => {
      createNewSession();
    });

    adminRefreshButtonEl.addEventListener("click", () => {
      loadAdminUsers();
    });

    adminCreateFormEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = adminNewUsernameEl.value.trim();
      const password = adminNewPasswordEl.value;
      const isAdmin = adminNewIsAdminEl.checked;
      if (!username || !password) {
        adminErrorEl.textContent = "Username and password are required.";
        return;
      }

      try {
        await createAdminUser(username, password, isAdmin);
      } catch (error) {
        adminErrorEl.textContent = error.message;
      }
    });

    clearButton.addEventListener("click", async () => {
      if (state.authEnabled) {
        if (state.activeSessionId) {
          await fetchWithAuth(`/sessions/${state.activeSessionId}`, {
            method: "DELETE"
          });
        }
        await createNewSession();
        return;
      }

      state.messages = [];
      state.conversationSummary = "";
      state.summarizedMessageCount = 0;
      compactChipEl.hidden = true;
      latestRouteEl.textContent = "None";
      renderMessages();
      renderReferences([]);
      promptEl.focus();
    });

    renderMessages();
    loadAuthConfig();
  </script>
</body>
</html>
