  ray-worker-embedding-1:
    build: *main-build
    container_name: ray-worker-embedding-1
    hostname: ray-worker-embedding-1
    restart: unless-stopped
    depends_on:
      ray-worker-embedding-bootstrap:
        condition: service_completed_successfully
    gpus: all
    shm_size: "10gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        until ray start \
          --address=ray-head:6379 \
          --num-cpus="$${RAY_WORKER_EMBEDDING_NUM_CPUS:-2}" \
          --num-gpus="$${RAY_WORKER_EMBEDDING_NUM_GPUS:-1}" \
          --resources='{"ray_worker_embedding": 1}' \
          --block; do
          echo "Waiting for ray-head..."
          sleep 3
        done
    environment:
      <<: *ray-worker-env
      RAY_WORKER_EMBEDDING_NUM_CPUS: ${RAY_WORKER_EMBEDDING_NUM_CPUS:-2}
      RAY_WORKER_EMBEDDING_NUM_GPUS: ${RAY_WORKER_EMBEDDING_NUM_GPUS:-1}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ./models:/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket;
          s=socket.create_connection(('ray-head', 6379), 2);
          s.close()"
      interval: 10s
      timeout: 3s
      retries: 2
      start_period: 60s

